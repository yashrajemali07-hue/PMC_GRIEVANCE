services:
  - type: web
    name: ecotrack
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ecotrack_db
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
