{% extends "base.html" %}
{% block title %}Verify Email - PMC Smart Environmental Cell{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card pmc-auth-card">
    <span class="panel-kicker">PMC Secure OTP</span>
    <h1>Verify email</h1>
    <p class="text-muted">Enter the 6-digit verification OTP sent to <strong>{{ email }}</strong>. It expires in 5 minutes.</p>
    <form method="POST" class="eco-form">
      <input class="form-control otp-input mb-3" name="otp" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
      <button class="btn btn-eco w-100">Verify Account</button>
    </form>
    <form method="POST" action="{{ url_for('auth.resend_otp') }}" class="mt-3 text-center">
      <input type="hidden" name="email" value="{{ email }}">
      <button class="btn btn-link">Resend OTP</button>
    </form>
  </div>
</section>
{% endblock %}
