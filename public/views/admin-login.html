<!-- public/views/admin-login.html -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="pmc-card p-4">
        <div class="text-center mb-4">
          <div class="p-3 bg-danger bg-opacity-10 text-danger rounded-circle d-inline-block mb-2">
            <i class="bi bi-shield-lock-fill fs-2"></i>
          </div>
          <h3 class="fw-bold text-danger">PMC Officer Login</h3>
          <p class="text-muted small">Authorized Municipal Ward Officers & System Administrators</p>
        </div>

        <div class="alert alert-danger py-2 small" ng-if="errorMsg">
          <i class="bi bi-exclamation-circle me-1"></i> {{ errorMsg }}
        </div>

        <form ng-submit="doAdminLogin()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Admin Username / Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
              <input type="text" class="form-control" ng-model="adminData.username" placeholder="admin or email" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" ng-model="adminData.password" placeholder="Admin password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm" ng-disabled="submitting">
            <span ng-if="!submitting"><i class="bi bi-shield-check me-1"></i> Enter Officer Dashboard</span>
            <span ng-if="submitting"><i class="bi bi-hourglass-split me-1"></i> Authenticating...</span>
          </button>
        </form>

        <div class="p-3 bg-light rounded-3 border mt-4 text-center small text-muted">
          <i class="bi bi-info-circle text-primary me-1"></i>
          Default college project admin login uses <code>ADMIN_USER</code> & <code>ADMIN_PASS</code> from <code>.env</code>.
        </div>
      </div>
    </div>
  </div>
</div>
