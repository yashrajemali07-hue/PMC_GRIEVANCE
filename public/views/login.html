<!-- public/views/login.html -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="pmc-card p-4">
        <div class="text-center mb-4">
          <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-circle d-inline-block mb-2">
            <i class="bi bi-box-arrow-in-right fs-2"></i>
          </div>
          <h3 class="fw-bold text-primary">Citizen Login</h3>
          <p class="text-muted small">Sign in to report grievances and track your civic score</p>
        </div>

        <div class="alert alert-danger py-2 small" ng-if="errorMsg">
          <i class="bi bi-exclamation-circle me-1"></i> {{ errorMsg }}
        </div>

        <form ng-submit="doLogin()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" ng-model="loginData.email" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" ng-model="loginData.password" placeholder="Your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm" ng-disabled="submitting">
            <span ng-if="!submitting"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
            <span ng-if="submitting"><i class="bi bi-hourglass-split me-1"></i> Signing in...</span>
          </button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top small">
          <a href="#/register" class="text-primary fw-semibold">Create New Account</a>
          <a href="#/admin-login" class="text-muted"><i class="bi bi-shield-lock me-1"></i>Admin Portal</a>
        </div>
      </div>
    </div>
  </div>
</div>
