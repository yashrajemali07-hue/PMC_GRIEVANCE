<!-- public/views/verify-otp.html -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="pmc-card p-4">
        <div class="text-center mb-4">
          <div class="p-3 bg-success bg-opacity-10 text-success rounded-circle d-inline-block mb-2">
            <i class="bi bi-shield-lock-fill fs-2"></i>
          </div>
          <h3 class="fw-bold text-success">Verify Your Email</h3>
          <p class="text-muted small">Enter the 6-digit OTP code sent to your registered email</p>
        </div>

        <div class="alert alert-danger py-2 small" ng-if="errorMsg">
          <i class="bi bi-exclamation-circle me-1"></i> {{ errorMsg }}
        </div>
        <div class="alert alert-success py-2 small" ng-if="successMsg">
          <i class="bi bi-check-circle me-1"></i> {{ successMsg }}
        </div>

        <!-- Dev Mode Helper: Displays OTP when MAIL_USERNAME is not configured -->
        <div class="alert alert-info py-2 px-3 small mb-3 border-info" ng-if="devOtp">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <i class="bi bi-terminal me-1 text-primary"></i>
              <strong>Dev OTP:</strong> <span class="badge bg-primary fs-6 font-monospace ms-1">{{ devOtp }}</span>
            </div>
            <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2 fw-semibold" ng-click="autoFillOtp()">
              <i class="bi bi-magic me-1"></i> Fill OTP
            </button>
          </div>
          <div class="text-muted mt-1" style="font-size: 11px;">
            Simulated in Dev Mode because MAIL_USERNAME is not set.
          </div>
        </div>

        <form ng-submit="doVerifyOtp()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" ng-model="otpData.email" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">6-Digit OTP</label>
            <input type="text" class="form-control text-center fs-3 fw-bold letter-spacing-4" maxlength="6" ng-model="otpData.otp" placeholder="123456" required>
            <div class="form-text small text-muted">
              Note: In dev mode, check your backend server console for the generated OTP.
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm" ng-disabled="submitting">
            <span ng-if="!submitting"><i class="bi bi-check2-circle me-1"></i> Verify & Activate Account</span>
            <span ng-if="submitting"><i class="bi bi-hourglass-split me-1"></i> Verifying...</span>
          </button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top small">
          <button type="button" class="btn btn-link text-decoration-none p-0 text-muted" ng-click="resendOtp()">
            <i class="bi bi-arrow-clockwise me-1"></i> Resend OTP
          </button>
          <a href="#/login" class="text-primary fw-semibold">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
